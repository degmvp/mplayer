<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>POLYDEV PLAYER</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: navy;
  color: yellowgreen;
  text-align:center;
}

.container {
  margin-top:20px;
}

.topbar img {
  width:60px;
  margin:10px;
  cursor:pointer;
  transition: transform .2s;
}

.topbar img:hover {
  transform: scale(1.1);
}

select {
  padding:8px;
  margin:10px;
  font-size:16px;
  border-radius:8px;
}

audio, video {
  width:80%;
  max-width:700px;
  margin-top:15px;
  border:2px solid yellowgreen;
  border-radius:10px;
}

button {
  padding:10px 15px;
  margin:5px;
  background:yellowgreen;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.info {
  margin-top:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 POLYDEV PLAYER</h1>

<!-- TOP ICONS -->
<div class="topbar">
  <a href="https://www.youtube.com" target="_blank">
    <img src="yt.png" alt="YouTube">
  </a>

  <a href="https://www.google.com" target="_blank">
    <img src="google.png" alt="Google">
  </a>
</div>

<hr>

<!-- AUDIO -->
<h2>🎧 Áudio</h2>

<select id="audioSelect"></select><br>
<audio id="audioPlayer" controls></audio>

<div class="info" id="audioInfo">Nenhuma música selecionada</div>

<div>
<button onclick="prevAudio()">Anterior</button>
<button onclick="toggleAudio()">Play / Pausa</button>
<button onclick="nextAudio()">Próxima</button>
</div>

<hr>

<!-- VIDEO -->
<h2>🎬 Vídeo</h2>

<select id="videoSelect"></select><br>
<video id="videoPlayer" controls></video>

<div class="info" id="videoInfo">Nenhum vídeo selecionado</div>

<div>
<button onclick="prevVideo()">Anterior</button>
<button onclick="toggleVideo()">Play / Pausa</button>
<button onclick="nextVideo()">Próximo</button>
</div>

</div>

<script>
// CONFIG
const totalAudios = 9;
const totalVideos = 9;

let currentAudio = 0;
let currentVideo = 0;

// AUDIO
const audioSelect = document.getElementById("audioSelect");
const audioPlayer = document.getElementById("audioPlayer");
const audioInfo   = document.getElementById("audioInfo");

function loadAudioList() {
  audioSelect.innerHTML = "<option value=''>Selecione</option>";
  for (let i = 1; i <= totalAudios; i++) {
    let opt = document.createElement("option");
    opt.value = `Y-MP3/ms${i}.mp3`;
    opt.text  = `Música ${i}`;
    audioSelect.appendChild(opt);
  }
}

audioSelect.onchange = () => {
  if (!audioSelect.value) return;
  currentAudio = audioSelect.selectedIndex;
  audioPlayer.src = audioSelect.value;
  audioPlayer.play();
  audioInfo.innerText = "Tocando: " + audioSelect.value;
};

function toggleAudio(){
  audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
}

function nextAudio(){
  if (currentAudio < totalAudios) {
    currentAudio++;
    audioSelect.selectedIndex = currentAudio;
    audioSelect.onchange();
  }
}

function prevAudio(){
  if (currentAudio > 1) {
    currentAudio--;
    audioSelect.selectedIndex = currentAudio;
    audioSelect.onchange();
  }
}

// VIDEO
const videoSelect = document.getElementById("videoSelect");
const videoPlayer = document.getElementById("videoPlayer");
const videoInfo   = document.getElementById("videoInfo");

function loadVideoList() {
  videoSelect.innerHTML = "<option value=''>Selecione</option>";
  for (let i = 1; i <= totalVideos; i++) {
    let opt = document.createElement("option");
    opt.value = `Y-MP4/video${i}.mp4`;
    opt.text  = `Vídeo ${i}`;
    videoSelect.appendChild(opt);
  }
}

videoSelect.onchange = () => {
  if (!videoSelect.value) return;
  currentVideo = videoSelect.selectedIndex;
  videoPlayer.src = videoSelect.value;
  videoPlayer.play();
  videoInfo.innerText = "Reproduzindo: " + videoSelect.value;
};

function toggleVideo(){
  videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
}

function nextVideo(){
  if (currentVideo < totalVideos) {
    currentVideo++;
    videoSelect.selectedIndex = currentVideo;
    videoSelect.onchange();
  }
}

function prevVideo(){
  if (currentVideo > 1) {
    currentVideo--;
    videoSelect.selectedIndex = currentVideo;
    videoSelect.onchange();
  }
}

// INIT
loadAudioList();
loadVideoList();
</script>

</body>
</html>
