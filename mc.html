<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>POLYDEV PLAYER</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: navy;
  color: yellowgreen;
}

.sidebar {
  position: fixed;
  width: 200px;
  height: 100%;
  background: black;
  padding: 15px;
}

.sidebar h2 {
  text-align:center;
}

.sidebar button {
  width:100%;
  padding:10px;
  margin:5px 0;
  background: yellowgreen;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.container {
  margin-left:220px;
  padding:20px;
  text-align:center;
}

select {
  padding:10px;
  border-radius:8px;
  margin:10px;
}

audio, video, iframe {
  width:80%;
  max-width:700px;
  margin-top:20px;
  border-radius:10px;
  border:2px solid yellowgreen;
}

.controls button {
  padding:10px;
  margin:5px;
  background: yellowgreen;
  border:none;
  cursor:pointer;
}
</style>

</head>
<body>

<div class="sidebar">
  <h2>POLYDEV</h2>

  <button onclick="loadCategory('python')">🐍 Python</button>
  <button onclick="loadCategory('sql')">🗄️ SQL</button>
  <button onclick="loadCategory('media')">🎧 Media</button>
</div>

<div class="container">

<h1>🚀 POLYDEV PLAYER</h1>

<!-- AUDIO -->
<h2>🎧 Áudio</h2>
<select id="audioSelect"></select>
<br>
<audio id="audioPlayer" controls></audio>

<div class="controls">
<button onclick="prevAudio()">⏮️</button>
<button onclick="toggleAudio()">⏯️</button>
<button onclick="nextAudio()">⏭️</button>
</div>

<!-- VIDEO LOCAL -->
<h2>🎬 Vídeo Local</h2>
<select id="videoSelect"></select>
<br>
<video id="videoPlayer" controls></video>

<!-- YOUTUBE -->
<h2>🌍 YouTube</h2>
<select id="ytSelect"></select>
<br>
<iframe id="ytPlayer" height="350" allowfullscreen></iframe>

</div>

<script>

const data = {
  python: {
    audio: ["Y-MP3/ms1.mp3","Y-MP3/ms2.mp3"],
    video: ["Y-MP4/video1.mp4"],
    yt: ["https://www.youtube.com/embed/kqtD5dpn9C8"]
  },
  sql: {
    audio: ["Y-MP3/ms3.mp3"],
    video: ["Y-MP4/video2.mp4"],
    yt: ["https://www.youtube.com/embed/HXV3zeQKqGY"]
  },
  media: {
    audio: ["Y-MP3/ms4.mp3"],
    video: ["Y-MP4/video3.mp4"],
    yt: ["https://www.youtube.com/embed/dQw4w9WgXcQ"]
  }
};

function loadCategory(cat) {
  loadSelect("audioSelect", data[cat].audio);
  loadSelect("videoSelect", data[cat].video);
  loadSelect("ytSelect", data[cat].yt);
}

function loadSelect(id, items) {
  const select = document.getElementById(id);
  select.innerHTML = "<option>Escolha...</option>";

  items.forEach((item, i) => {
    const opt = document.createElement("option");
    opt.value = item;
    opt.text = item.split("/").pop();
    select.appendChild(opt);
  });
}

// AUDIO
const audioPlayer = document.getElementById("audioPlayer");
const audioSelect = document.getElementById("audioSelect");

audioSelect.onchange = () => {
  audioPlayer.src = audioSelect.value;
  audioPlayer.play();
};

function toggleAudio(){
  audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
}

function nextAudio(){
  audioSelect.selectedIndex++;
  audioSelect.onchange();
}

function prevAudio(){
  audioSelect.selectedIndex--;
  audioSelect.onchange();
}

// VIDEO
const videoPlayer = document.getElementById("videoPlayer");
const videoSelect = document.getElementById("videoSelect");

videoSelect.onchange = () => {
  videoPlayer.src = videoSelect.value;
  videoPlayer.play();
};

// YOUTUBE
const ytSelect = document.getElementById("ytSelect");
const ytPlayer = document.getElementById("ytPlayer");

ytSelect.onchange = () => {
  ytPlayer.src = ytSelect.value;
};

loadCategory("python");

</script>

</body>
</html>
