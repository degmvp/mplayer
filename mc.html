<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>POLYDEV PLAYER AUTO</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: navy;
  color: yellowgreen;
  text-align:center;
}

.container {
  margin-top:20px;
}

.topbar img {
  width:60px;
  margin:10px;
  cursor:pointer;
}

select {
  padding:8px;
  margin:10px;
  font-size:16px;
  border-radius:8px;
}

audio, video {
  width:80%;
  max-width:700px;
  margin-top:15px;
  border:2px solid yellowgreen;
  border-radius:10px;
}

button {
  padding:10px 15px;
  margin:5px;
  background:yellowgreen;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.info {
  margin-top:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 POLYDEV PLAYER</h1>

<!-- LINKS -->
<div class="topbar">
  <a href="https://www.youtube.com" target="_blank">
    <img src="yt.png">
  </a>

  <a href="https://www.google.com" target="_blank">
    <img src="google.png">
  </a>
</div>

<hr>

<!-- AUDIO -->
<h2>🎧 Áudio</h2>

<select id="audioSelect"></select><br>
<audio id="audioPlayer" controls></audio>

<div class="info" id="audioInfo">Modo automático ativado</div>

<div>
<button onclick="prevAudio()">Anterior</button>
<button onclick="toggleAudio()">Pausa</button>
<button onclick="nextAudio()">Próxima</button>
</div>

<hr>

<!-- VIDEO -->
<h2>🎬 Vídeo</h2>

<select id="videoSelect"></select><br>
<video id="videoPlayer" controls></video>

<div class="info" id="videoInfo">Modo automático ativado</div>

<div>
<button onclick="prevVideo()">Anterior</button>
<button onclick="toggleVideo()">Pausa</button>
<button onclick="nextVideo()">Próximo</button>
</div>

</div>

<script>
// CONFIG
const totalAudios = 99;
const totalVideos = 99;

let currentAudio = 1;
let currentVideo = 1;

// ELEMENTOS
const audioSelect = document.getElementById("audioSelect");
const audioPlayer = document.getElementById("audioPlayer");
const audioInfo = document.getElementById("audioInfo");

const videoSelect = document.getElementById("videoSelect");
const videoPlayer = document.getElementById("videoPlayer");
const videoInfo = document.getElementById("videoInfo");

// ================= AUDIO =================
function loadAudioList() {
  audioSelect.innerHTML = "";
  for (let i = 1; i <= totalAudios; i++) {
    const opt = document.createElement("option");
    opt.value = `Y-MP3/ms${i}.mp3`;
    opt.text  = `Música ${i}`;
    audioSelect.appendChild(opt);
  }
}

// AUTO START
audioSelect.addEventListener("focus", () => {
  startAudio(1);
});

function startAudio(index) {
  currentAudio = index;
  audioSelect.selectedIndex = index - 1;
  audioPlayer.src = `Y-MP3/ms${index}.mp3`;
  audioPlayer.play();
  audioInfo.innerText = "Tocando: ms" + index + ".mp3";
}

function nextAudio(){
  if (currentAudio < totalAudios) {
    startAudio(++currentAudio);
  }
}

function prevAudio(){
  if (currentAudio > 1) {
    startAudio(--currentAudio);
  }
}

function toggleAudio(){
  audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
}

// AUTO NEXT
audioPlayer.onended = () => {
  nextAudio();
};

// ================= VIDEO =================
function loadVideoList() {
  videoSelect.innerHTML = "";
  for (let i = 1; i <= totalVideos; i++) {
    const opt = document.createElement("option");
    opt.value = `Y-MP4/video${i}.mp4`;
    opt.text  = `Vídeo ${i}`;
    videoSelect.appendChild(opt);
  }
}

// AUTO START
videoSelect.addEventListener("focus", () => {
  startVideo(1);
});

function startVideo(index) {
  currentVideo = index;
  videoSelect.selectedIndex = index - 1;
  videoPlayer.src = `Y-MP4/video${index}.mp4`;
  videoPlayer.play();
  videoInfo.innerText = "Reproduzindo: video" + index + ".mp4";
}

function nextVideo(){
  if (currentVideo < totalVideos) {
    startVideo(++currentVideo);
  }
}

function prevVideo(){
  if (currentVideo > 1) {
    startVideo(--currentVideo);
  }
}

function toggleVideo(){
  videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
}

// AUTO NEXT
videoPlayer.onended = () => {
  nextVideo();
};

// INIT
loadAudioList();
loadVideoList();
</script>

</body>
</html>
