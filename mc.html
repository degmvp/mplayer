<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>POLYDEV PLAYER</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: navy;
  color: yellowgreen;
}

.sidebar {
  position: fixed;
  width: 200px;
  height: 100%;
  background: black;
  padding: 15px;
}

.sidebar h2 {
  text-align:center;
}

.sidebar button {
  width:100%;
  padding:10px;
  margin:5px 0;
  background: yellowgreen;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.container {
  margin-left:220px;
  padding:20px;
  text-align:center;
}

select {
  padding:10px;
  border-radius:8px;
  margin:10px;
}

audio, video, iframe {
  width:80%;
  max-width:700px;
  margin-top:20px;
  border-radius:10px;
  border:2px solid yellowgreen;
}

.controls button {
  padding:10px 15px;
  margin:5px;
  background: yellowgreen;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
</style>

</head>
<body>

<div class="sidebar">
  <h2>POLYDEV</h2>
</div>

<div class="container">

<h1>🚀 POLYDEV PLAYER</h1>

<!-- AUDIO -->
<h2>🎧 Áudio</h2>
<select id="audioSelect"></select>
<br>
<audio id="audioPlayer" controls></audio>

<div class="controls">
<button onclick="prevAudio()">Anterior</button>
<button onclick="toggleAudio()">Pausa</button>
<button onclick="nextAudio()">Próxima</button>
</div>

<!-- VIDEO LOCAL -->
<h2>🎬 Vídeo Local</h2>
<select id="videoSelect"></select>
<br>
<video id="videoPlayer" controls></video>

<div class="controls">
<button onclick="prevVideo()">Anterior</button>
<button onclick="toggleVideo()">Pausa</button>
<button onclick="nextVideo()">Próxima</button>
</div>

<!-- YOUTUBE -->
<h2>🌍 YouTube</h2>
<select id="ytSelect">
  <option value="">Escolha um vídeo</option>
  <option value="https://www.youtube.com/embed/kqtD5dpn9C8">Python Intro</option>
  <option value="https://www.youtube.com/embed/HXV3zeQKqGY">SQL Intro</option>
</select>
<br>
<iframe id="ytPlayer" height="350" allowfullscreen></iframe>

</div>

<script>

// ===== GERAR LISTA AUTOMÁTICA =====
function carregarAudios() {
  const select = document.getElementById("audioSelect");
  select.innerHTML = "<option value=''>Escolha uma música</option>";

  for (let i = 1; i <= 9; i++) {
    let nome = `Y-MP3/ms${i}.mp3`;
    let opt = document.createElement("option");
    opt.value = nome;
    opt.text = `Música ${i}`;
    select.appendChild(opt);
  }
}

function carregarVideos() {
  const select = document.getElementById("videoSelect");
  select.innerHTML = "<option value=''>Escolha um vídeo</option>";

  for (let i = 1; i <= 9; i++) {
    let nome = `Y-MP4/video${i}.mp4`;
    let opt = document.createElement("option");
    opt.value = nome;
    opt.text = `Vídeo ${i}`;
    select.appendChild(opt);
  }
}

// ===== AUDIO =====
const audioPlayer = document.getElementById("audioPlayer");
const audioSelect = document.getElementById("audioSelect");

audioSelect.onchange = () => {
  audioPlayer.src = audioSelect.value;
  audioPlayer.play();
};

function toggleAudio(){
  audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
}

function nextAudio(){
  if (audioSelect.selectedIndex < audioSelect.options.length - 1){
    audioSelect.selectedIndex++;
    audioSelect.onchange();
  }
}

function prevAudio(){
  if (audioSelect.selectedIndex > 1){
    audioSelect.selectedIndex--;
    audioSelect.onchange();
  }
}

// ===== VIDEO =====
const videoPlayer = document.getElementById("videoPlayer");
const videoSelect = document.getElementById("videoSelect");

videoSelect.onchange = () => {
  videoPlayer.src = videoSelect.value;
  videoPlayer.play();
};

function toggleVideo(){
  videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
}

function nextVideo(){
  if (videoSelect.selectedIndex < videoSelect.options.length - 1){
    videoSelect.selectedIndex++;
    videoSelect.onchange();
  }
}

function prevVideo(){
  if (videoSelect.selectedIndex > 1){
    videoSelect.selectedIndex--;
    videoSelect.onchange();
  }
}

// ===== YOUTUBE =====
const ytSelect = document.getElementById("ytSelect");
const ytPlayer = document.getElementById("ytPlayer");

ytSelect.onchange = () => {
  ytPlayer.src = ytSelect.value;
};

// INIT
carregarAudios();
carregarVideos();

</script>

</body>
</html>
